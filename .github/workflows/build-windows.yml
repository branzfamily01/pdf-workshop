name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf_workshop/**'
      - 'launcher.py'
      - 'requirements.txt'
      - 'manual.html'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Tesseract and Japanese language data
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $dir = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path (Join-Path $dir 'tesseract.exe'))) {
            throw "Tesseract was not found at $dir"
          }
          $tessdata = Join-Path $dir 'tessdata'
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          curl.exe -L 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn.traineddata' -o (Join-Path $tessdata 'jpn.traineddata')
          Write-Host "Tesseract: $dir"

      - name: Run core tests
        run: python run_tests.py

      - name: Build Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDFWorkshop `
            --collect-all ocrmypdf `
            --collect-all pypdfium2 `
            --hidden-import pdf_workshop.main `
            launcher.py

      - name: Bundle Tesseract
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path (Join-Path $dir 'tesseract.exe'))) {
            throw "Tesseract executable is missing: $dir"
          }
          $target = 'dist/PDFWorkshop/runtime/tesseract'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $dir '*') -Destination $target -Recurse -Force
          if (!(Test-Path (Join-Path $target 'tesseract.exe'))) { throw 'Bundled tesseract.exe is missing' }
          if (!(Test-Path (Join-Path $target 'tessdata/jpn.traineddata'))) { throw 'Bundled Japanese OCR data is missing' }

      - name: Add manual, notices and beginner guide
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md dist/PDFWorkshop/THIRD_PARTY_NOTICES.md
          Copy-Item manual.html dist/PDFWorkshop/manual.html
          @'
          PDF Workshop - はじめかた
          ==========================

          1. このZIPを解凍します。
          2. PDFWorkshop.exe をダブルクリックします。
          3. PDFを画面へドラッグします。
          4. 分からないときは画面の「？ 使い方」を押します。

          Pythonのインストールは不要です。
          OCR用Tesseractもこのフォルダに同梱されています。
          '@ | Set-Content -Encoding UTF8 dist/PDFWorkshop/はじめに.txt

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/PDFWorkshop/* -DestinationPath PDFWorkshop-Windows-Portable.zip -Force

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: PDFWorkshop-Windows-Portable
          path: PDFWorkshop-Windows-Portable.zip
          retention-days: 30

      - name: Record successful build
        shell: pwsh
        run: |
          $status = @{
            schemaVersion = 1
            status = 'success'
            artifact = 'PDFWorkshop-Windows-Portable'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          $status | Set-Content -Encoding UTF8 build-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status.json
          git commit -m 'Record successful Windows build' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
